# Compose czyta `.env` z katalogu projektu (Jenkins: Vault → plik → up).
# Backend: env_file + entrypoint (`prisma migrate deploy` → `node server.js`) —
#   bez osobnego serwisu migrate (compose nie umie auto-`docker rm` po Exited;
#   self-rm z wewnątrz też nie działa — procesy giną z kontenerem).
# FRONT: BACKEND_ORIGIN → build-arg VITE_BACKEND_ORIGIN.
services:
  backend:
    build:
      context: ./backend
    container_name: budgetApp-backend
    restart: always
    networks:
      - main_network
    ports:
      - "127.0.0.1:5053:5053"
    env_file:
      - .env
    volumes:
      - ./backend/logs:/app/logs
    environment:
      - DB_HOST=main_db

  app:
    build:
      context: ./frontend
      args:
        VITE_BACKEND_ORIGIN: ${BACKEND_ORIGIN}
    container_name: budgetApp-frontend
    restart: always
    networks:
      - main_network
    ports:
      - "0.0.0.0:5052:3000"

networks:
  main_network:
    external: true
    name: main_network
