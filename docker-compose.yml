# Compose czyta `.env` z katalogu projektu (Jenkins zapisuje tu sekrety z Vault).
# FRONT: BACKEND_ORIGIN → build-arg VITE_BACKEND_ORIGIN (bez zmian w jobie Jenkins).
services:
  backend:
    build:
      context: ./backend
    container_name: budgetApp-backend
    restart: always
    networks:
      - main_network
    ports:
      - "127.0.0.1:5053:5053"
    volumes:
      - ./backend/logs:/app/logs
      - ./.env:/app/.env
    environment:
      - DB_HOST=main_db
  app:
    build:
      context: ./frontend
      args:
        VITE_BACKEND_ORIGIN: ${BACKEND_ORIGIN}
    container_name: budgetApp-frontend
    restart: always
    networks:
      - main_network
    ports:
      - "127.0.0.1:5052:3000"

networks:
  main_network:
    external: true
    name: main_network
